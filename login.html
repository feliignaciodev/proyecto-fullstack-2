<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de usuarios</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
        <header>
        <nav class="navbar navbar-expand-lg navbar-tienda">
            <div class="container">
                <a class="marca" href="index.html">Poleras <span>Express</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="menu">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link activo" href="login.html">Iniciar sesión</a></li>
                        <li class="nav-item"><a class="nav-link " href="registro.html">Crear cuenta</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="pagina-login">
        <form id="formLogin" action="index.html" method="get">
            <img src="img/login2.png" alt="Logo de Poleras Express">

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="nombre@correo.cl" autocomplete="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña"
                autocomplete="current-password" required>

            <div class="box_visible">
                <button type="submit">Iniciar sesión</button>
            </div>

            <div class="box_visible">
                <p>¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
            </div>
        </form>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
